name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
    # ── 1. Create the GitHub release once, before any build job runs ──
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |

            // context.ref_name is unavailable in github-script; derive from context.ref instead


            const tag = context.ref.replace('refs/tags/', '');

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,

              tag_name: tag,


              name: `OpenSub ${tag}`,

              draft: false,
              prerelease: false,
            });
            return data.id;

    # ── 2. Build on each platform and upload to the existing release ──
  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ffmpeg_asset: ffmpeg-linux-x64.gz
            ffprobe_asset: ffprobe-linux-x64.gz
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ffmpeg_asset: ffmpeg-win32-x64.gz
            ffprobe_asset: ffprobe-win32-x64.gz
          - platform: macos-latest
            target: aarch64-apple-darwin
            ffmpeg_asset: ffmpeg-darwin-arm64.gz
            ffprobe_asset: ffprobe-darwin-arm64.gz
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target (macOS cross-compile)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Configure macOS build environment
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "CFLAGS=-march=armv8.5-a" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-march=armv8.5-a" >> "$GITHUB_ENV"
          echo "GGML_NATIVE=OFF" >> "$GITHUB_ENV"
          echo "GGML_CPU_ALL_VARIANTS=OFF" >> "$GITHUB_ENV"
      - name: Download FFmpeg sidecars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          BASE_URL="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1"
          
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ext=".exe"
          else
            ext=""
          fi

          curl -L --fail "$BASE_URL/${{ matrix.ffmpeg_asset }}" -o "src-tauri/binaries/ffmpeg-${{ matrix.target }}${ext}.gz"
          gunzip -f "src-tauri/binaries/ffmpeg-${{ matrix.target }}${ext}.gz"

          curl -L --fail "$BASE_URL/${{ matrix.ffprobe_asset }}" -o "src-tauri/binaries/ffprobe-${{ matrix.target }}${ext}.gz"
          gunzip -f "src-tauri/binaries/ffprobe-${{ matrix.target }}${ext}.gz"

          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "src-tauri/binaries/ffmpeg-${{ matrix.target }}" "src-tauri/binaries/ffprobe-${{ matrix.target }}"
          fi

          echo "Prepared sidecars:"
          ls -la src-tauri/binaries
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}
