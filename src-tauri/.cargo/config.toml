
# Force deployment target for aarch64-apple-darwin builds.
# std::filesystem (fs::path) used by ggml/whisper.cpp requires macOS 10.15+.
# Apple Silicon only runs on macOS 11+, so 11.0 is the correct floor.
# force=true overrides any ambient env var the runner might already have set.
# These are also set in the workflow step for double coverage.
[target.aarch64-apple-darwin]
rustflags = []

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "11.0", force = true }
CMAKE_OSX_DEPLOYMENT_TARGET = { value = "11.0", force = true }
